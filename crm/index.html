<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRM | Vida de Ouro Jacareí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/crm.css" />
</head>
<body class="login-body">

  <div class="login-card">
    <img src="/assets/img/logo.svg" alt="Vida de Ouro Jacareí" class="login-logo" onerror="this.style.display='none'" />
    <h1 class="login-title">CRM Vida de Ouro</h1>
    <p class="login-sub">Acesse o painel de gestão da corretora</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Entrar</button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>

  <script src="assets/crm.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Entrando...';
      try {
        const r = await fetch(API('/auth/login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            senha: document.getElementById('senha').value
          })
        });
        if (!r.ok) throw new Error((await r.json()).error || 'Erro');
        const { token, user } = await r.json();
        sessionStorage.setItem('crm_token', token);
        sessionStorage.setItem('crm_user', JSON.stringify(user));
        location.href = 'dashboard.html';
      } catch (x) {
        err.textContent = x.message;
      } finally {
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });
    if (sessionStorage.getItem('crm_token')) location.href = 'dashboard.html';
  </script>
</body>
</html>
