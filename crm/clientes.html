<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes | CRM Vida de Ouro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/crm.css" />
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="content">
  <div class="top-bar">
    <div><h1>Clientes</h1><p>Clientes da corretora</p></div>
    <button class="btn btn-primary" onclick="novoCliente()">+ Novo cliente</button>
  </div>
  <div class="table-card">
    <div class="table-toolbar">
      <div class="table-toolbar__filters">
        <input type="search" id="search" placeholder="Buscar por nome, documento, email..." />
      </div>
      <span class="text-muted text-small" id="countLabel"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th>Cidade</th><th>Corretor</th><th>Cadastro</th><th></th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script src="assets/crm.js"></script>
<script>
// Helpers (apiGet, apiPost, esc, renderSidebar, toast, etc.) já são globais via crm.js — não redeclarar.
if (requireAuth()) {
  renderSidebar('clientes');
  const user = getUser();
  const isAdmin = user.role === 'admin';
  let all = [], corretores = [], page = 1;
  async function load() {
    [all, corretores] = await Promise.all([
      apiGet('/clientes'),
      isAdmin ? apiGet('/usuarios').catch(()=>[]) : Promise.resolve([])
    ]);
    render();
  }
  function render() {
    const q = (document.getElementById('search').value || '').toLowerCase();
    const rows = all.filter(r => !q || (r.nome+' '+(r.cpf_cnpj||'')+' '+(r.email||'')).toLowerCase().includes(q));
    document.getElementById('countLabel').textContent = `${rows.length} de ${all.length}`;
    const pg = paginate(rows, page); page = pg.page;
    document.getElementById('tableBody').innerHTML = rows.length
      ? pg.slice.map(r => `<tr>
          <td><strong>${esc(r.nome)}</strong>${r.email ? `<br><span class="text-small text-muted">${esc(r.email)}</span>`:''}</td>
          <td>${esc(r.cpf_cnpj||'-')}</td>
          <td>${r.telefone ? `<a href="${wppLink(r.telefone)}" target="_blank" rel="noopener">${esc(r.telefone)}</a>`:'-'}</td>
          <td>${esc(r.cidade||'-')}</td>
          <td>${esc(r.corretor_nome||'-')}</td>
          <td class="text-small">${fmtDate(r.criado_em)}</td>
          <td><div class="row-actions">
            <button class="icon-btn" title="Editar" onclick='editCliente(${JSON.stringify(JSON.stringify(r))})'><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg></button>
            <button class="icon-btn icon-btn--del" title="Excluir" onclick="delCliente(${r.id})"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6"/></svg></button>
          </div></td>
        </tr>`).join('')
      : '<tr class="empty-row"><td colspan="7">Nenhum cliente.</td></tr>';
    renderPager(document.getElementById('pager'), pg, (n) => { page = n; render(); });
  }
  document.getElementById('search').addEventListener('input', () => { page = 1; render(); });

  function formHTML(r = {}) {
    return `<form>
      <div class="form-group"><label>Nome *</label><input name="nome" required value="${esc(r.nome||'')}"></div>
      <div class="form-row">
        <div class="form-group"><label>CPF/CNPJ</label><input name="cpf_cnpj" value="${esc(r.cpf_cnpj||'')}"></div>
        <div class="form-group"><label>Telefone</label><input name="telefone" value="${esc(r.telefone||'')}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Email</label><input name="email" type="email" value="${esc(r.email||'')}"></div>
        <div class="form-group"><label>Cidade</label><input name="cidade" value="${esc(r.cidade||'')}"></div>
      </div>
      <div class="form-group"><label>Endereço</label><input name="endereco" value="${esc(r.endereco||'')}"></div>
      ${isAdmin ? `<div class="form-group"><label>Corretor responsável</label>
        <select name="corretor_id"><option value="">—</option>${corretores.map(c=>`<option value="${c.id}" ${r.corretor_id===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>` : ''}
    </form>`;
  }
  window.novoCliente = () => openModal('Novo cliente', formHTML(), '', async (d) => {
    await apiPost('/clientes', d); closeModal(); toast('Cliente criado!'); load();
  });
  window.editCliente = (j) => { const r = JSON.parse(j);
    openModal('Editar cliente #'+r.id, formHTML(r), '', async (d) => {
      await apiPut('/clientes/'+r.id, d); closeModal(); toast('Cliente atualizado!'); load();
    });
  };
  window.delCliente = async (id) => { if (!confirm('Excluir cliente e todas as apólices/sinistros vinculados?')) return;
    await apiDel('/clientes/'+id); toast('Cliente excluído!'); load(); };

  load().catch(e => toast(e.message, true));
}
</script>
</body>
</html>
