<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuários | CRM Vida de Ouro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/crm.css" />
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="content">
  <div class="top-bar">
    <div><h1>Usuários</h1><p>Corretores e administradores do CRM</p></div>
    <button class="btn btn-primary" onclick="novoUser()">+ Novo usuário</button>
  </div>
  <div class="table-card">
    <div class="table-toolbar">
      <div class="table-toolbar__filters">
        <input type="search" id="search" placeholder="Buscar por nome ou email..." />
        <select id="roleFilter">
          <option value="">Todos os perfis</option>
          <option value="admin">Administradores</option>
          <option value="corretor">Corretores</option>
        </select>
      </div>
      <span class="text-muted text-small" id="countLabel"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nome</th><th>Email</th><th>Perfil</th><th>Ativo</th><th>Criado em</th><th></th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script src="assets/crm.js"></script>
<script>
// Helpers (apiGet, apiPost, esc, renderSidebar, toast, etc.) já são globais via crm.js — não redeclarar.
if (requireAuth()) {
  renderSidebar('usuarios');
  const self = getUser();
  if (self.role !== 'admin') { location.href = 'dashboard.html'; }
  let all = [], page = 1;
  async function load() { all = await apiGet('/usuarios'); render(); }
  function render() {
    const q = (document.getElementById('search').value || '').toLowerCase();
    const rf = document.getElementById('roleFilter').value;
    const rows = all.filter(r =>
      (!rf || r.role === rf) &&
      (!q || (r.nome + ' ' + (r.email || '')).toLowerCase().includes(q))
    );
    document.getElementById('countLabel').textContent = `${rows.length} de ${all.length}`;
    const pg = paginate(rows, page); page = pg.page;
    document.getElementById('tableBody').innerHTML = rows.length
      ? pg.slice.map(r => `<tr>
          <td><strong>${esc(r.nome)}</strong></td>
          <td>${esc(r.email)}</td>
          <td><span class="badge badge--${r.role==='admin'?'admin':'corretor'}">${r.role==='admin'?'Administrador':'Corretor'}</span></td>
          <td>${r.ativo ? '<span class="badge badge--ativo2">Ativo</span>' : '<span class="badge badge--inativo">Inativo</span>'}</td>
          <td class="text-small">${fmtDate(r.criado_em)}</td>
          <td><div class="row-actions">
            <button class="icon-btn" onclick='editUser(${JSON.stringify(JSON.stringify(r))})'><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg></button>
            ${r.id !== self.id ? `<button class="icon-btn icon-btn--del" onclick="delUser(${r.id})"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6"/></svg></button>` : ''}
          </div></td>
        </tr>`).join('')
      : '<tr class="empty-row"><td colspan="6">Nenhum usuário.</td></tr>';
    renderPager(document.getElementById('pager'), pg, (n) => { page = n; render(); });
  }
  document.getElementById('search').addEventListener('input', () => { page = 1; render(); });
  document.getElementById('roleFilter').addEventListener('change', () => { page = 1; render(); });
  function formHTML(r = {}) {
    return `<form>
      <div class="form-group"><label>Nome *</label><input name="nome" required value="${esc(r.nome||'')}"></div>
      <div class="form-group"><label>Email *</label><input name="email" type="email" required value="${esc(r.email||'')}"></div>
      <div class="form-group"><label>Senha ${r.id?'(deixe em branco para manter)':'*'}</label><input name="senha" type="password" ${r.id?'':'required'} placeholder="${r.id?'•••••':'mínimo 6 caracteres'}"></div>
      <div class="form-row">
        <div class="form-group"><label>Perfil *</label>
          <select name="role">
            <option value="corretor" ${r.role==='corretor'?'selected':''}>Corretor</option>
            <option value="admin" ${r.role==='admin'?'selected':''}>Administrador</option>
          </select>
        </div>
        <div class="form-group"><label>Ativo</label>
          <select name="ativo"><option value="1" ${r.ativo!==0?'selected':''}>Sim</option><option value="0" ${r.ativo===0?'selected':''}>Não</option></select>
        </div>
      </div>
    </form>`;
  }
  window.novoUser = () => openModal('Novo usuário', formHTML(), '', async (d) => {
    if (!d.senha || d.senha.length < 6) { toast('Senha mínima de 6 caracteres', true); return; }
    await apiPost('/usuarios', d); closeModal(); toast('Usuário criado!'); load();
  });
  window.editUser = (j) => { const r = JSON.parse(j);
    openModal('Editar usuário #'+r.id, formHTML(r), '', async (d) => {
      if (d.senha === '') delete d.senha;
      else if (d.senha.length < 6) { toast('Senha mínima de 6 caracteres', true); return; }
      await apiPut('/usuarios/'+r.id, d); closeModal(); toast('Usuário atualizado!'); load();
    });
  };
  window.delUser = async (id) => { if (!confirm('Excluir usuário?')) return;
    await apiDel('/usuarios/'+id); toast('Usuário excluído!'); load(); };

  load().catch(e => toast(e.message, true));
}
</script>
</body>
</html>
