<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agenda | CRM Vida de Ouro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/crm.css" />
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="content">
  <div class="top-bar">
    <div><h1>Agenda</h1><p>Retornos, follow-ups e compromissos</p></div>
    <div class="flex gap-8"><button class="btn btn-outline" id="calendarToggle" type="button">▦ Ver calendário</button><button class="btn btn-primary" onclick="novoAgendamento()">+ Novo agendamento</button></div>
  </div>
  <div class="calendar-card" id="calendarCard" hidden><div class="calendar-head"><button id="prevMonth" class="icon-btn">‹</button><strong id="calendarTitle"></strong><button id="nextMonth" class="icon-btn">›</button></div><div class="calendar-week"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div><div class="calendar-grid" id="calendarGrid"></div></div>
  <div class="table-card" id="agendaTable">
    <div class="table-toolbar">
      <div class="table-toolbar__filters">
        <select id="statusFilter">
          <option value="">Todos</option>
          <option value="pendente">Pendentes</option>
          <option value="concluido">Concluídos</option>
          <option value="cancelado">Cancelados</option>
        </select>
        <input type="search" id="search" placeholder="Buscar..." />
      </div>
      <span class="text-muted text-small" id="countLabel"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data/hora</th><th>Título</th><th>Cliente/Lead</th><th>Observação</th><th>Status</th><th></th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script src="assets/crm.js"></script>
<script>
// Helpers (apiGet, apiPost, esc, renderSidebar, toast, etc.) já são globais via crm.js — não redeclarar.
if (requireAuth()) {
  renderSidebar('agendamentos');
  const user = getUser();
  const isAdmin = user.role === 'admin';
  let all = [], clientes = [], leads = [], corretores = [], page = 1, calendarDate = new Date();
  async function load() {
    [all, clientes, leads, corretores] = await Promise.all([
      apiGet('/agendamentos'), apiGet('/clientes'), apiGet('/leads'),
      isAdmin ? apiGet('/usuarios').catch(()=>[]) : Promise.resolve([])
    ]);
    render();
  }
  function render() {
    const q = (document.getElementById('search').value||'').toLowerCase();
    const s = document.getElementById('statusFilter').value;
    const rows = all.filter(r => (!s||r.status===s) && (!q||(r.titulo+' '+(r.cliente_nome||'')+' '+(r.lead_nome||'')).toLowerCase().includes(q)));
    rows.sort((a,b) => (a.data_hora||'').localeCompare(b.data_hora||''));
    document.getElementById('countLabel').textContent = `${rows.length} de ${all.length}`;
    const pg = paginate(rows, page); page = pg.page;
    document.getElementById('tableBody').innerHTML = rows.length
      ? pg.slice.map(r => `<tr>
          <td>${fmtDateTime(r.data_hora)}</td>
          <td><strong>${esc(r.titulo)}</strong></td>
          <td>${esc(r.cliente_nome || r.lead_nome || '-')}</td>
          <td class="text-small">${esc((r.observacao||'').slice(0,60))}${r.observacao && r.observacao.length>60?'…':''}</td>
          <td>${badgeForStatus(r.status)}</td>
          <td><div class="row-actions">
            <button class="icon-btn" onclick='editAg(${JSON.stringify(JSON.stringify(r))})'><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg></button>
            <button class="icon-btn icon-btn--del" onclick="delAg(${r.id})"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6"/></svg></button>
          </div></td>
        </tr>`).join('')
      : '<tr class="empty-row"><td colspan="6">Nenhum agendamento.</td></tr>';
    renderPager(document.getElementById('pager'), pg, (n) => { page = n; render(); });
    renderCalendar(rows);
  }
  function renderCalendar(rows) {
    const year=calendarDate.getFullYear(),month=calendarDate.getMonth(),first=new Date(year,month,1),last=new Date(year,month+1,0);
    document.getElementById('calendarTitle').textContent=calendarDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    const cells=[];for(let i=0;i<first.getDay();i++)cells.push('<div class="calendar-day calendar-day--muted"></div>');
    for(let day=1;day<=last.getDate();day++){const key=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');const events=rows.filter(r=>String(r.data_hora||'').slice(0,10)===key);const today=new Date().toISOString().slice(0,10)===key;cells.push('<div class="calendar-day '+(today?'calendar-day--today':'')+'"><span class="calendar-day__number">'+day+'</span>'+events.slice(0,3).map(r=>'<button class="calendar-event calendar-event--'+r.status+'" data-event-id="'+r.id+'" title="'+esc(r.titulo)+'">'+esc(r.titulo)+'</button>').join('')+(events.length>3?'<small>+'+(events.length-3)+' compromisso(s)</small>':'')+'</div>');}
    document.getElementById('calendarGrid').innerHTML=cells.join('');
    document.querySelectorAll('[data-event-id]').forEach(b=>b.addEventListener('click',()=>{const r=all.find(x=>x.id===Number(b.dataset.eventId));if(r)editAg(JSON.stringify(r));}));
  }
  document.getElementById('calendarToggle').addEventListener('click',()=>{const cal=document.getElementById('calendarCard'),table=document.getElementById('agendaTable'),show=cal.hidden;cal.hidden=!show;table.hidden=show;document.getElementById('calendarToggle').textContent=show?'☷ Ver tabela':'▦ Ver calendário';});
  document.getElementById('prevMonth').addEventListener('click',()=>{calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()-1,1);render();});
  document.getElementById('nextMonth').addEventListener('click',()=>{calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+1,1);render();});
  document.getElementById('search').addEventListener('input', () => { page = 1; render(); });
  document.getElementById('statusFilter').addEventListener('change', () => { page = 1; render(); });

  function formHTML(r = {}) {
    const dt = r.data_hora ? r.data_hora.replace(' ', 'T').slice(0,16) : '';
    return `<form>
      <div class="form-row">
        <div class="form-group"><label>Data e hora *</label><input name="data_hora" type="datetime-local" required value="${dt}"></div>
        <div class="form-group"><label>Status</label>
          <select name="status">${['pendente','concluido','cancelado'].map(s=>`<option value="${s}" ${r.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-group"><label>Título *</label><input name="titulo" required value="${esc(r.titulo||'')}"></div>
      <div class="form-row">
        <div class="form-group"><label>Cliente (opcional)</label>
          <select name="cliente_id"><option value="">—</option>${clientes.map(c=>`<option value="${c.id}" ${r.cliente_id===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>
        </div>
        <div class="form-group"><label>Lead (opcional)</label>
          <select name="lead_id"><option value="">—</option>${leads.map(l=>`<option value="${l.id}" ${r.lead_id===l.id?'selected':''}>${esc(l.nome)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="form-group"><label>Observação</label><textarea name="observacao">${esc(r.observacao||'')}</textarea></div>
      ${isAdmin ? `<div class="form-group"><label>Corretor</label>
        <select name="corretor_id"><option value="">—</option>${corretores.map(c=>`<option value="${c.id}" ${r.corretor_id===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>` : ''}
    </form>`;
  }
  window.novoAgendamento = () => openModal('Novo agendamento', formHTML(), '', async (d) => {
    if (d.data_hora) d.data_hora = d.data_hora.replace('T',' ');
    await apiPost('/agendamentos', d); closeModal(); toast('Agendamento criado!'); load();
  });
  window.editAg = (j) => { const r = JSON.parse(j);
    openModal('Editar agendamento #'+r.id, formHTML(r), '', async (d) => {
      if (d.data_hora) d.data_hora = d.data_hora.replace('T',' ');
      await apiPut('/agendamentos/'+r.id, d); closeModal(); toast('Agendamento atualizado!'); load();
    });
  };
  window.delAg = async (id) => { if (!confirm('Excluir agendamento?')) return;
    await apiDel('/agendamentos/'+id); toast('Excluído!'); load(); };

  load().catch(e => toast(e.message, true));
}
</script>
</body>
</html>
