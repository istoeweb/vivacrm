<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leads | CRM Vida de Ouro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/crm.css" />
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="content">
  <div class="top-bar">
    <div><h1>Leads</h1><p>Contatos recebidos do site e cadastros manuais</p></div>
    <div class="flex gap-8"><button class="btn btn-outline" id="viewToggle" type="button">▦ Ver Kanban</button><button class="btn btn-primary" onclick="novoLead()">+ Novo lead</button></div>
  </div>

  <div class="kanban-board" id="kanbanBoard" hidden></div>
  <div class="table-card" id="leadsTable">
    <div class="table-toolbar">
      <div class="table-toolbar__filters">
        <input type="search" id="search" placeholder="Buscar por nome, telefone, produto..." />
        <select id="statusFilter">
          <option value="">Todos os status</option>
          <option value="novo">Novo</option>
          <option value="contato_realizado">Contato realizado</option>
          <option value="proposta_enviada">Proposta enviada</option>
          <option value="aguardando_retorno">Aguardando retorno</option>
          <option value="fechado">Fechado</option>
          <option value="desistiu">Desistiu</option>
          <option value="sem_interesse">Não tem interesse</option>
        </select>
        <select id="assignFilter">
          <option value="">Todos os corretores</option>
          <option value="nao">Não atribuídos</option>
          <option value="meus">Meus leads</option>
        </select>
      </div>
      <span class="text-muted text-small" id="countLabel"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Nome</th><th>Telefone</th><th>Produto</th><th>Cidade</th>
          <th>Status</th><th>Últ. contato</th><th>Próx. retorno</th><th>Corretor</th><th>Recebido em</th><th></th>
        </tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script src="assets/crm.js"></script>
<script>
// Helpers (apiGet, apiPost, esc, renderSidebar, toast, etc.) já são globais via crm.js — não redeclarar.
if (requireAuth()) {
  renderSidebar('leads');
  const user = getUser();
  const isAdmin = user.role === 'admin';
  let all = [], corretores = [], page = 1;

  async function load() {
    [all, corretores] = await Promise.all([
      apiGet('/leads'),
      isAdmin ? apiGet('/usuarios').catch(() => []) : Promise.resolve([])
    ]);
    render();
  }
  function render() {
    const q = (document.getElementById('search').value || '').toLowerCase();
    const s = document.getElementById('statusFilter').value;
    const af = document.getElementById('assignFilter').value;
    const rows = all.filter(r =>
      (!s || r.status === s) &&
      (af === '' || (af === 'nao' && !r.corretor_id) || (af === 'meus' && r.corretor_id === user.id)) &&
      (!q || (r.nome+' '+(r.telefone||'')+' '+(r.produto||'')+' '+(r.email||'')).toLowerCase().includes(q))
    );
    document.getElementById('countLabel').textContent = `${rows.length} de ${all.length}`;
    const pg = paginate(rows, page); page = pg.page;
    document.getElementById('tableBody').innerHTML = rows.length
      ? pg.slice.map(r => `<tr>
          <td><strong>${esc(r.nome)}</strong>${r.email ? `<br><span class="text-small text-muted">${esc(r.email)}</span>` : ''}</td>
          <td>${r.telefone ? `<a href="${wppLink(r.telefone)}" target="_blank" rel="noopener" title="Chamar no WhatsApp">${esc(r.telefone)}</a>` : '-'}</td>
          <td>${esc(r.produto || '-')}</td>
          <td>${esc(r.cidade || '-')}</td>
          <td>${badgeForStatus(r.status)}</td>
          <td class="text-small">${r.ultimo_contato ? fmtDateTime(r.ultimo_contato) : '-'}</td>
          <td class="text-small">${r.proximo_retorno ? fmtDateTime(r.proximo_retorno) : '-'}</td>
          <td>${esc(r.corretor_nome || '-')}</td>
          <td class="text-small">${fmtDate(r.criado_em)}</td>
          <td><div class="row-actions">
            ${!r.corretor_id ? `<button class="icon-btn" title="Assumir lead" onclick="assumirLead(${r.id})"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg></button>` : ''}
            <button class="icon-btn" title="Editar" onclick='editLead(${JSON.stringify(JSON.stringify(r))})'><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4z"/></svg></button>
            <button class="icon-btn" title="Converter em cliente" onclick='converterCliente(${r.id},"${esc(r.nome)}")'><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg></button>
            ${isAdmin ? `<button class="icon-btn icon-btn--del" title="Excluir" onclick="delLead(${r.id})"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 01-2 2H9a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>` : ''}
          </div></td>
        </tr>`).join('')
      : '<tr class="empty-row"><td colspan="10">Nenhum lead encontrado.</td></tr>';
    renderPager(document.getElementById('pager'), pg, (n) => { page = n; render(); });
    renderKanban(rows);
  }
  const KANBAN = [
    ['novo','Novo'],['contato_realizado','Contato realizado'],['proposta_enviada','Proposta enviada'],
    ['aguardando_retorno','Aguardando retorno'],['fechado','Fechado'],['desistiu','Desistiu']
  ];
  function renderKanban(rows) {
    document.getElementById('kanbanBoard').innerHTML = KANBAN.map(([status,label]) => {
      const cards=rows.filter(r=>r.status===status);
      const cardHtml=cards.map(r=>'<article class="kanban-card" draggable="true" data-id="'+r.id+'"><strong>'+esc(r.nome)+'</strong><small>'+esc(r.produto||'Produto não informado')+'</small><span>'+esc(r.telefone||r.cidade||'')+'</span><button type="button" data-edit-id="'+r.id+'">Abrir</button></article>').join('');
      return '<section class="kanban-column" data-status="'+status+'"><header><strong>'+label+'</strong><span>'+cards.length+'</span></header><div class="kanban-column__body">'+(cardHtml||'<div class="kanban-empty">Solte aqui</div>')+'</div></section>';
    }).join('');
    document.querySelectorAll('.kanban-card').forEach(c=>c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('dragging');}));
    document.querySelectorAll('[data-edit-id]').forEach(b=>b.addEventListener('click',()=>{const r=all.find(x=>x.id===Number(b.dataset.editId));if(r)editLead(JSON.stringify(r));}));
    document.querySelectorAll('.kanban-column').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag-over');});col.addEventListener('dragleave',()=>col.classList.remove('drag-over'));col.addEventListener('drop',async e=>{e.preventDefault();col.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain');try{await apiPut('/leads/'+id,{status:col.dataset.status});toast('Lead movido!');load();}catch(err){toast(err.message,true);}});});
  }
  document.getElementById('viewToggle').addEventListener('click',()=>{
    const board=document.getElementById('kanbanBoard'),table=document.getElementById('leadsTable'),show=board.hidden;
    board.hidden=!show;table.hidden=show;document.getElementById('viewToggle').textContent=show?'☷ Ver tabela':'▦ Ver Kanban';
  });
  document.getElementById('search').addEventListener('input', () => { page = 1; render(); });
  document.getElementById('statusFilter').addEventListener('change', () => { page = 1; render(); });
  document.getElementById('assignFilter').addEventListener('change', () => { page = 1; render(); });

  window.assumirLead = async (id) => {
    try { await apiPost('/leads/'+id+'/assumir', {}); toast('Lead atribuído a você!'); load(); }
    catch (e) { toast(e.message, true); }
  };

  function formHTML(r = {}) {
    const lc = r.ultimo_contato ? r.ultimo_contato.replace(' ', 'T').slice(0,16) : '';
    const pr = r.proximo_retorno ? r.proximo_retorno.replace(' ', 'T').slice(0,16) : '';
    const statusOpts = [
      ['novo','Novo'], ['contato_realizado','Contato realizado'], ['proposta_enviada','Proposta enviada'],
      ['aguardando_retorno','Aguardando retorno'], ['fechado','Fechado'],
      ['desistiu','Desistiu'], ['sem_interesse','Não tem interesse']
    ];
    return `<form>
      <div class="form-group"><label>Nome *</label><input name="nome" required value="${esc(r.nome||'')}"></div>
      <div class="form-row">
        <div class="form-group"><label>Telefone *</label><input name="telefone" required value="${esc(r.telefone||'')}"></div>
        <div class="form-group"><label>Email</label><input name="email" type="email" value="${esc(r.email||'')}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Cidade</label><input name="cidade" value="${esc(r.cidade||'')}"></div>
        <div class="form-group"><label>Produto</label><input name="produto" value="${esc(r.produto||'')}"></div>
      </div>
      <div class="form-group"><label>Mensagem</label><textarea name="mensagem">${esc(r.mensagem||'')}</textarea></div>
      <div class="form-row">
        <div class="form-group"><label>Status</label>
          <select name="status">
            ${statusOpts.map(([v,l]) => `<option value="${v}" ${r.status===v?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
        ${isAdmin ? `<div class="form-group"><label>Atribuir ao corretor</label>
          <select name="corretor_id"><option value="">— Sem corretor —</option>${corretores.map(c=>`<option value="${c.id}" ${r.corretor_id===c.id?'selected':''}>${esc(c.nome)}</option>`).join('')}</select>
        </div>` : ''}
      </div>
      <div class="form-row">
        <div class="form-group"><label>Último contato</label><input name="ultimo_contato" type="datetime-local" value="${lc}"></div>
        <div class="form-group"><label>Próximo retorno</label><input name="proximo_retorno" type="datetime-local" value="${pr}"></div>
      </div>
    </form>`;
  }
  function normDate(v) { return v ? String(v).replace('T', ' ').slice(0, 16) : v; }
  window.novoLead = () => {
    openModal('Novo lead', formHTML(), '', async (data) => {
      data.ultimo_contato = normDate(data.ultimo_contato);
      data.proximo_retorno = normDate(data.proximo_retorno);
      await apiPost('/leads', { ...data, origem: 'manual' });
      closeModal(); toast('Lead criado!'); load();
    });
  };
  window.editLead = (json) => {
    const r = JSON.parse(json);
    openModal('Editar lead #' + r.id, formHTML(r), '', async (data) => {
      data.ultimo_contato = normDate(data.ultimo_contato);
      data.proximo_retorno = normDate(data.proximo_retorno);
      await apiPut('/leads/' + r.id, data);
      closeModal(); toast('Lead atualizado!'); load();
    });
  };
  window.delLead = async (id) => {
    if (!confirm('Excluir este lead?')) return;
    await apiDel('/leads/' + id); toast('Lead excluído!'); load();
  };
  window.converterCliente = async (leadId, nome) => {
    const r = await apiGet('/leads/' + leadId);
    openModal('Converter em cliente — ' + nome, `
      <form>
        <div class="form-group"><label>Nome *</label><input name="nome" required value="${esc(r.nome||'')}"></div>
        <div class="form-row">
          <div class="form-group"><label>Telefone</label><input name="telefone" value="${esc(r.telefone||'')}"></div>
          <div class="form-group"><label>Email</label><input name="email" value="${esc(r.email||'')}"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>CPF/CNPJ</label><input name="cpf_cnpj"></div>
          <div class="form-group"><label>Cidade</label><input name="cidade" value="${esc(r.cidade||'')}"></div>
        </div>
      </form>
    `, '', async (data) => {
      const c = await apiPost('/clientes', data);
      await apiPut('/leads/' + leadId, { status: 'fechado' });
      closeModal(); toast('Cliente criado!'); load();
    });
  };

  load().catch(e => toast(e.message, true));
}
</script>
</body>
</html>
