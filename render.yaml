services:
  - type: web
    name: vivacrm
    runtime: node
    region: ohio
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: JWT_SECRET
        generateValue: true
