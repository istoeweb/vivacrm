services:
  - type: web
    name: vivacrm
    runtime: node
    region: ohio
    # Discos persistentes exigem plano pago. No plano free o filesystem é
    # efêmero: cada deploy/restart apagaria o SQLite e as imagens do blog.
    plan: starter
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Dados que precisam sobreviver a deploys: banco SQLite e uploads do blog.
    disk:
      name: vivacrm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/crm.db
      - key: BLOG_UPLOAD_DIR
        value: /var/data/blog
      # Supabase: com DATABASE_URL o CRM usa o Postgres do Supabase (e o disco
      # deixa de ser necessário para o banco); com SUPABASE_URL + service_role
      # as imagens do blog vão para o Supabase Storage. Preencha no painel do Render.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Origens do site institucional. A URL *.onrender.com é liberada
      # automaticamente via RENDER_EXTERNAL_URL (ver server.js).
      - key: ALLOWED_ORIGINS
        value: https://vidadeouro.com.br,https://www.vidadeouro.com.br
